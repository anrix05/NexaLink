<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexaLink | Vidyalankar Institute of Technology, Mumbai</title>
    <meta name="description" content="NexaLink is an institutional web platform designed for Vidyalankar Institute of Technology to centralize alumni data management and enable structured peer-to-peer engagement." />
    <meta name="keywords" content="VIT Mumbai, NexaLink, Alumni Platform, Vidyalankar Institute of Technology, Mentorship, Networking" />
    
    <!-- Web App Manifest & Favicons -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="NexaLink | Vidyalankar Institute of Technology, Mumbai" />
    <meta property="og:description" content="NexaLink is an institutional web platform designed for Vidyalankar Institute of Technology to centralize alumni data management and enable structured peer-to-peer engagement." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexaLink | Vidyalankar Institute of Technology, Mumbai" />
    <meta name="twitter:description" content="Institutional platform connecting Vidyalankar students, verified alumni, and faculty." />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- One-time Intro Decision Script (Runs before first paint) -->
    <script>
      (function() {
        try {
          var href = window.location.href;
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var fullQuery = search + hash;
          var path = window.location.pathname || '/';

          // 1. Forced override via query params
          if (search.indexOf('intro=1') !== -1) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'play';
            return;
          }
          if (search.indexOf('intro=0') !== -1) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // 1.5 Authenticated session bypass
          try {
            var hasAuth = false;
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && ((key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) || key === 'nexalink_auth_user')) {
                hasAuth = true;
                break;
              }
            }
            if (hasAuth) {
              document.documentElement.dataset.intro = 'skip';
              return;
            }
          } catch (e) {}

          // 2. Strict route check: only on initial boot at '/'
          if (path !== '/') {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // 3. Supabase Auth callback parameter detection
          if (
            fullQuery.indexOf('access_token') !== -1 ||
            fullQuery.indexOf('type=recovery') !== -1 ||
            fullQuery.indexOf('type=signup') !== -1 ||
            fullQuery.indexOf('type=magiclink') !== -1 ||
            fullQuery.indexOf('code=') !== -1 ||
            fullQuery.indexOf('error_description=') !== -1
          ) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // 4. Accessibility and automation
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }
          if (navigator.webdriver) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // 5. Cheap hardware and network signals
          var nav = navigator;
          var conn = nav.connection || nav.mozConnection || nav.webkitConnection;
          if (conn && conn.saveData) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }
          if ((nav.hardwareConcurrency && nav.hardwareConcurrency <= 2) || (nav.deviceMemory && nav.deviceMemory <= 2)) {
            sessionStorage.setItem('nexalink:intro:v1', 'true');
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // 6. Session persistence check (one-time per browser session tab)
          var seen = sessionStorage.getItem('nexalink:intro:v1');
          if (seen) {
            document.documentElement.dataset.intro = 'skip';
            return;
          }

          // Mark as seen immediately at start of playback so mid-intro refresh does not replay
          sessionStorage.setItem('nexalink:intro:v1', 'true');
          document.documentElement.dataset.intro = 'play';
        } catch (e) {
          // If storage access fails, default to skip to prevent breaking user flow
          document.documentElement.dataset.intro = 'skip';
        }
      })();
    </script>

    <!-- Intro Stage Styles & Failsafes -->
    <style>
      :root {
        --nexalink-node: #FD9C03;
      }
      #intro-root {
        display: none;
      }
      html[data-intro="play"],
      html[data-intro="exit"] {
        background: #000000 !important;
      }
      html[data-intro="play"] body,
      html[data-intro="exit"] body {
        overflow: hidden !important;
        background: #000000 !important;
      }
      html[data-intro="play"] #intro-root,
      html[data-intro="exit"] #intro-root {
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #000000;
        pointer-events: auto;
      }
      /* Prevent navbar or landing page from ever bleeding through while intro plays */
      #root {
        transition: opacity 400ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html[data-intro="play"] #root {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html[data-intro="exit"] #root {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      [data-intro-target="logo"] {
        transition: opacity 200ms ease;
      }
      html[data-intro="play"] [data-intro-target="logo"],
      html[data-intro="exit"] [data-intro-target="logo"] {
        opacity: 0 !important;
      }
      html[data-intro="done"] [data-intro-target="logo"] {
        opacity: 1 !important;
      }
      /* Hard failsafe: hides overlay after 5 seconds if edge case occurs */
      @keyframes nexalinkIntroFailsafe {
        0%, 99.9% {
          visibility: visible;
        }
        100% {
          visibility: hidden;
          pointer-events: none;
          opacity: 0;
        }
      }
      html[data-intro="play"] #intro-root {
        animation: nexalinkIntroFailsafe 5s forwards;
      }
    </style>

    <noscript>
      <style>
        #intro-root {
          display: none !important;
        }
        html[data-intro="play"] body {
          overflow: auto !important;
        }
        html[data-intro="play"] [data-intro-target="logo"] {
          opacity: 1 !important;
        }
      </style>
    </noscript>

  </head>
  <body class="bg-white text-slate-950 font-sans antialiased min-h-screen selection:bg-slate-900 selection:text-white">
    <div id="intro-root" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
