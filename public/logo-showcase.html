<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NexaLink Logo Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 960px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .header {
      text-align: center;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .header p {
      color: #9CA3AF;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .card.light {
      background: #FFFFFF;
      border-color: #E5E7EB;
      color: #0A0A0A;
    }
    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      border-radius: 16px;
      background: #000000;
      width: 100%;
    }
    .card.light .preview-box {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
    }
    .lockup {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .card.light .brand-title {
      color: #0A0A0A;
    }
    .sizes-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .image-preview {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #262626;
    }
    .image-preview img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NexaLink — Minimal Aesthetic Identity</h1>
      <p>Geometric Interlocking "N" Link with Central Amber Nexus Core</p>
    </div>

    <div class="grid">
      <!-- Dark Lockup -->
      <div class="card">
        <div class="preview-box">
          <div class="lockup">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
                <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
              </g>
              <circle cx="18" cy="18" r="2.8" fill="#F59E0B" />
              <circle cx="18" cy="18" r="1.1" fill="#FFFFFF" opacity="0.9" />
            </svg>
            <span class="brand-title">NexaLink</span>
          </div>
        </div>
        <div class="sizes-row">
          <!-- 16px -->
          <svg width="16" height="16" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#FFFFFF"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#FFFFFF"/>
            </g>
            <circle cx="18" cy="18" r="3.2" fill="#F59E0B" />
          </svg>
          <!-- 24px -->
          <svg width="24" height="24" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#FFFFFF"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#FFFFFF"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#F59E0B" />
          </svg>
          <!-- 32px -->
          <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#FFFFFF"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#FFFFFF"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#F59E0B" />
          </svg>
          <!-- 48px -->
          <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#FFFFFF"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#FFFFFF"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#F59E0B" />
            <circle cx="18" cy="18" r="1.1" fill="#FFFFFF" opacity="0.9" />
          </svg>
        </div>
        <p style="font-size: 13px; color: #9CA3AF;">Dark Surface Rendering</p>
      </div>

      <!-- Light Lockup -->
      <div class="card light">
        <div class="preview-box">
          <div class="lockup">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="0.8"/>
                <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="0.8"/>
              </g>
              <circle cx="18" cy="18" r="2.8" fill="#B45309" />
              <circle cx="18" cy="18" r="1.1" fill="#FFFFFF" opacity="0.9" />
            </svg>
            <span class="brand-title">NexaLink</span>
          </div>
        </div>
        <div class="sizes-row">
          <!-- 16px -->
          <svg width="16" height="16" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#0A0A0A"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#0A0A0A"/>
            </g>
            <circle cx="18" cy="18" r="3.2" fill="#B45309" />
          </svg>
          <!-- 24px -->
          <svg width="24" height="24" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#0A0A0A"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#0A0A0A"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#B45309" />
          </svg>
          <!-- 32px -->
          <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#0A0A0A"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#0A0A0A"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#B45309" />
          </svg>
          <!-- 48px -->
          <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
            <g stroke-linejoin="round" stroke-linecap="round">
              <path d="M6.5 27.5V12.5L12.5 6.5H17.8L26.8 15.5L23.2 19.1L16.2 12.1H12.5V27.5H6.5Z" fill="#0A0A0A"/>
              <path d="M29.5 8.5V23.5L23.5 29.5H18.2L9.2 20.5L12.8 16.9L19.8 23.9H23.5V8.5H29.5Z" fill="#0A0A0A"/>
            </g>
            <circle cx="18" cy="18" r="2.8" fill="#B45309" />
            <circle cx="18" cy="18" r="1.1" fill="#FFFFFF" opacity="0.9" />
          </svg>
        </div>
        <p style="font-size: 13px; color: #6B7280;">Light Surface Rendering</p>
      </div>
    </div>

    <!-- Brand Identity Sheet Preview -->
    <div class="image-preview">
      <img src="/public/images/nexalink-brand-lockup.jpg" alt="Brand Identity Guidelines">
    </div>
  </div>
</body>
</html>
